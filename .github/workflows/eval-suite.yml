name: eval-suite

# Full measurement suite on GitHub runners: rebuild sim data, then attribution RUN A,
# prior-art refs (flugbild engine, AnaHD classic CPU) and final eval in parallel.
# Artifacts: run-a, refs-baselines, final-scores.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["code/**", ".github/workflows/eval-suite.yml"]

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install numpy opencv-python-headless scikit-image imageio imageio-ffmpeg
      - name: Build simulated clips
        working-directory: code
        run: python sim.py
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: sim-data
          path: |
            code/test_clean.npy
            code/test_deg.npy
            code/test_meta.pkl
            code/tune_clean.npy
            code/tune_deg.npy
            code/tune_meta.pkl
          retention-days: 7
          include-hidden-files: true

  attribution:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy opencv-python-headless scikit-image
      - uses: actions/download-artifact@v4
        with:
          name: sim-data
          path: code
      - name: RUN A (sync + med3/NLM attribution)
        working-directory: code
        run: python run_a.py
      - uses: actions/upload-artifact@v4
        with:
          name: run-a
          path: code/run_a.json

  refs:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<6" scikit-image
      - uses: actions/download-artifact@v4
        with:
          name: sim-data
          path: code
      - name: Clone reference engines
        run: |
          git clone --depth 1 https://github.com/Bratwurstexe/FPV_DVR_CLEANER refs/fpv_dvr_cleaner
          git clone --depth 1 https://github.com/dominic-salas/AnaHD refs/anahd
      - name: Tune refs on tune clip, then one-shot test clip
        working-directory: code
        env:
          REFS_DIR: ${{ github.workspace }}/refs
        run: |
          python run_refs.py tune
          python run_refs.py test
      - uses: actions/upload-artifact@v4
        with:
          name: refs-baselines
          path: |
            code/tune_refs.json
            code/refs_scores.json

  final-eval:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy opencv-python-headless scikit-image
      - uses: actions/download-artifact@v4
        with:
          name: sim-data
          path: code
      - name: Evaluate all npy outputs present
        working-directory: code
        run: python evaluate_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-scores
          path: code/final_scores.json
